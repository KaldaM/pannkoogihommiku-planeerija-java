plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

dependencies {
    implementation project(':planner-core')
    implementation 'org.apache.pdfbox:pdfbox:2.0.31'
}

javafx {
    version = '26.0.2'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.swing']
}

application {
    mainClass = 'ee.matteus.pannukas.gui.PancakePlannerApp'
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

def linuxAppName = 'pannkoogihommiku-planeerija'
def packagedMainClass = 'ee.matteus.pannukas.gui.PancakePlannerLauncher'
def packagedJavaModules = 'javafx.controls,javafx.fxml,javafx.swing,java.logging,java.prefs,java.scripting,jdk.jfr,jdk.unsupported.desktop'
def packageInputDirectory = layout.buildDirectory.dir('jpackage-input')
def linuxPackageDirectory = layout.buildDirectory.dir('jpackage')
def linuxAppImageDirectory = linuxPackageDirectory.map { it.dir(linuxAppName) }
def linuxRpmDirectory = layout.buildDirectory.dir('jpackage-rpm')
def linuxPackageResources = layout.projectDirectory.dir('src/main/jpackage/linux')
def javaFxRuntimeJars = configurations.runtimeClasspath.filter {
    it.name.startsWith('javafx-')
}
def packagingLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(25)
}

tasks.register('prepareLinuxPackageInput', Sync) {
    group = 'distribution'
    description = 'Prepares application classpath files for the Linux jpackage build.'
    dependsOn tasks.named('installDist')
    from(layout.buildDirectory.dir("install/${project.name}/lib")) {
        exclude 'javafx-*.jar'
    }
    into packageInputDirectory
}

tasks.register('packageLinuxAppImage', Exec) {
    group = 'distribution'
    description = 'Builds a self-contained Linux application image with jpackage.'
    dependsOn tasks.named('prepareLinuxPackageInput')
    onlyIf {
        System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('linux')
    }

    inputs.dir(packageInputDirectory)
    inputs.files(javaFxRuntimeJars)
    outputs.dir(linuxAppImageDirectory)

    doFirst {
        delete(linuxAppImageDirectory)

        File javaExecutable = packagingLauncher.get().executablePath.asFile
        File jpackageExecutable = new File(javaExecutable.parentFile, 'jpackage')
        if (!jpackageExecutable.isFile()) {
            throw new GradleException("Java 25 tööriistaahelast ei leitud jpackage käsku: ${jpackageExecutable}")
        }
        String javaFxModulePath = javaFxRuntimeJars.files
                .sort { first, second -> first.name <=> second.name }
                .collect { it.absolutePath }
                .join(File.pathSeparator)

        commandLine(
                jpackageExecutable,
                '--type', 'app-image',
                '--dest', linuxPackageDirectory.get().asFile,
                '--name', linuxAppName,
                '--app-version', project.version.toString(),
                '--description', 'Ürituse alaplaani ja elektrivajaduse planeerija',
                '--input', packageInputDirectory.get().asFile,
                '--main-jar', tasks.named('jar', Jar).get().archiveFileName.get(),
                '--main-class', packagedMainClass,
                '--module-path', javaFxModulePath,
                '--add-modules', packagedJavaModules,
                '--java-options', '--enable-native-access=javafx.graphics'
        )
    }
}

tasks.register('packageLinuxRpm', Exec) {
    group = 'distribution'
    description = 'Builds a Fedora-compatible RPM package from the Linux application image.'
    dependsOn tasks.named('packageLinuxAppImage')
    onlyIf {
        System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('linux')
    }

    inputs.dir(linuxAppImageDirectory)
    inputs.dir(linuxPackageResources)
    outputs.dir(linuxRpmDirectory)

    doFirst {
        delete(linuxRpmDirectory)
        File rpmDirectory = linuxRpmDirectory.get().asFile
        if (!rpmDirectory.mkdirs() && !rpmDirectory.isDirectory()) {
            throw new GradleException("RPM-paketi väljundkausta ei saanud luua: ${rpmDirectory}")
        }

        File javaExecutable = packagingLauncher.get().executablePath.asFile
        File jpackageExecutable = new File(javaExecutable.parentFile, 'jpackage')
        if (!jpackageExecutable.isFile()) {
            throw new GradleException("Java 25 tööriistaahelast ei leitud jpackage käsku: ${jpackageExecutable}")
        }

        commandLine(
                jpackageExecutable,
                '--type', 'rpm',
                '--dest', rpmDirectory,
                '--name', linuxAppName,
                '--app-image', linuxAppImageDirectory.get().asFile,
                '--app-version', project.version.toString(),
                '--vendor', 'Pannkoogihommiku planeerija',
                '--description', 'Ürituse alaplaani ja elektrivajaduse planeerija',
                '--resource-dir', linuxPackageResources.asFile,
                '--linux-package-name', linuxAppName,
                '--linux-app-release', '1',
                '--linux-app-category', 'Office',
                '--linux-menu-group', 'Office',
                '--linux-shortcut'
        )
    }
}
