plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

dependencies {
    implementation project(':planner-core')
    implementation 'org.apache.pdfbox:pdfbox:2.0.31'
}

javafx {
    version = '26.0.2'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.swing']
}

application {
    mainClass = 'ee.matteus.pannukas.gui.PlaaniseppApp'
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

def linuxAppName = 'plaanisepp'
def windowsAppName = 'Plaanisepp'
def packagedMainClass = 'ee.matteus.pannukas.gui.PlaaniseppLauncher'
def packagedJavaModules = 'javafx.controls,javafx.fxml,javafx.swing,java.logging,java.prefs,java.scripting,jdk.jfr,jdk.unsupported.desktop'
def packageInputDirectory = layout.buildDirectory.dir('jpackage-input')
def windowsPackageInputDirectory = layout.buildDirectory.dir('jpackage-input-windows')
def linuxPackageDirectory = layout.buildDirectory.dir('jpackage')
def linuxAppImageDirectory = linuxPackageDirectory.map { it.dir(linuxAppName) }
def linuxRpmDirectory = layout.buildDirectory.dir('jpackage-rpm')
def windowsPackageDirectory = layout.buildDirectory.dir('jpackage-windows')
def windowsAppImageDirectory = windowsPackageDirectory.map { it.dir(windowsAppName) }
def windowsInstallerDirectory = layout.buildDirectory.dir('jpackage-windows-installer')
def linuxPackageResources = layout.projectDirectory.dir('src/main/jpackage/linux')
def applicationIcon = layout.projectDirectory.file('src/main/resources/icons/plaanisepp-app-256.png')
def windowsApplicationIcon = layout.projectDirectory.file('src/main/resources/icons/plaanisepp-app.ico')
def planFileIcon = layout.projectDirectory.file('src/main/resources/icons/plaanisepp-plan-128.png')
def windowsPlanFileIcon = layout.projectDirectory.file('src/main/resources/icons/plaanisepp-plan.ico')
def planFileAssociation = layout.projectDirectory.file('src/main/jpackage/linux/pplan.properties')
def windowsPlanFileAssociation = layout.projectDirectory.file('src/main/jpackage/windows/pplan.properties')
def linuxThemeIcons = files(
        'src/main/resources/icons/plaanisepp-16.png',
        'src/main/resources/icons/plaanisepp-22.png',
        'src/main/resources/icons/plaanisepp-32.png',
        'src/main/resources/icons/plaanisepp-48.png',
        'src/main/resources/icons/plaanisepp-64.png',
        planFileIcon,
        applicationIcon
)
def javaFxRuntimeJars = configurations.runtimeClasspath.filter {
    it.name.startsWith('javafx-')
}
def packagingLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(25)
}

tasks.register('prepareLinuxPackageInput', Sync) {
    group = 'distribution'
    description = 'Prepares application classpath files for the Linux jpackage build.'
    dependsOn tasks.named('installDist')
    from(layout.buildDirectory.dir("install/${project.name}/lib")) {
        exclude 'javafx-*.jar'
    }
    into packageInputDirectory
}

tasks.register('prepareWindowsPackageInput', Sync) {
    group = 'distribution'
    description = 'Prepares application classpath files for the Windows jpackage build.'
    dependsOn tasks.named('installDist')
    from(layout.buildDirectory.dir("install/${project.name}/lib")) {
        exclude 'javafx-*.jar'
    }
    into windowsPackageInputDirectory
}

tasks.register('packageWindowsAppImage', Exec) {
    group = 'distribution'
    description = 'Builds a self-contained Windows application image with jpackage.'
    dependsOn tasks.named('prepareWindowsPackageInput')
    onlyIf {
        System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
    }

    inputs.dir(windowsPackageInputDirectory)
    inputs.files(javaFxRuntimeJars)
    inputs.file(windowsApplicationIcon)
    outputs.dir(windowsAppImageDirectory)

    doFirst {
        delete(windowsAppImageDirectory)

        File javaExecutable = packagingLauncher.get().executablePath.asFile
        File jpackageExecutable = new File(javaExecutable.parentFile, 'jpackage.exe')
        if (!jpackageExecutable.isFile()) {
            throw new GradleException("Java 25 tööriistaahelast ei leitud jpackage käsku: ${jpackageExecutable}")
        }
        String javaFxModulePath = javaFxRuntimeJars.files
                .sort { first, second -> first.name <=> second.name }
                .collect { it.absolutePath }
                .join(File.pathSeparator)

        commandLine(
                jpackageExecutable,
                '--type', 'app-image',
                '--dest', windowsPackageDirectory.get().asFile,
                '--name', windowsAppName,
                '--app-version', project.version.toString(),
                '--vendor', 'Plaanisepp',
                '--description', 'Sündmusala ja elektrivajaduse planeerija',
                '--icon', windowsApplicationIcon.asFile,
                '--input', windowsPackageInputDirectory.get().asFile,
                '--main-jar', tasks.named('jar', Jar).get().archiveFileName.get(),
                '--main-class', packagedMainClass,
                '--module-path', javaFxModulePath,
                '--add-modules', packagedJavaModules,
                '--java-options', '--enable-native-access=javafx.graphics'
        )
    }
}

tasks.register('packageWindowsInstaller', Exec) {
    group = 'distribution'
    description = 'Builds a Windows EXE installer from the self-contained application image.'
    dependsOn tasks.named('packageWindowsAppImage')
    onlyIf {
        System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
    }

    inputs.dir(windowsAppImageDirectory)
    inputs.file(windowsApplicationIcon)
    inputs.file(windowsPlanFileIcon)
    inputs.file(windowsPlanFileAssociation)
    outputs.dir(windowsInstallerDirectory)

    doFirst {
        delete(windowsInstallerDirectory)
        File installerDirectory = windowsInstallerDirectory.get().asFile
        if (!installerDirectory.mkdirs() && !installerDirectory.isDirectory()) {
            throw new GradleException("Windowsi paigaldaja väljundkausta ei saanud luua: ${installerDirectory}")
        }

        File javaExecutable = packagingLauncher.get().executablePath.asFile
        File jpackageExecutable = new File(javaExecutable.parentFile, 'jpackage.exe')
        if (!jpackageExecutable.isFile()) {
            throw new GradleException("Java 25 tööriistaahelast ei leitud jpackage käsku: ${jpackageExecutable}")
        }

        File dotnetToolDirectory = new File(System.getProperty('user.home'), '.dotnet/tools')
        if (dotnetToolDirectory.isDirectory()) {
            environment 'PATH', System.getenv('PATH') + File.pathSeparator + dotnetToolDirectory.absolutePath
        }

        commandLine(
                jpackageExecutable,
                '--type', 'exe',
                '--dest', installerDirectory,
                '--name', windowsAppName,
                '--app-image', windowsAppImageDirectory.get().asFile,
                '--app-version', project.version.toString(),
                '--vendor', 'Plaanisepp',
                '--description', 'Sündmusala ja elektrivajaduse planeerija',
                '--icon', windowsApplicationIcon.asFile,
                '--file-associations', windowsPlanFileAssociation.asFile,
                '--win-menu',
                '--win-menu-group', windowsAppName,
                '--win-dir-chooser',
                '--win-upgrade-uuid', '37407861-1917-4691-8209-e21e3810fb3e'
        )
    }
}

tasks.register('packageLinuxAppImage', Exec) {
    group = 'distribution'
    description = 'Builds a self-contained Linux application image with jpackage.'
    dependsOn tasks.named('prepareLinuxPackageInput')
    onlyIf {
        System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('linux')
    }

    inputs.dir(packageInputDirectory)
    inputs.files(javaFxRuntimeJars)
    inputs.file(applicationIcon)
    inputs.files(linuxThemeIcons)
    outputs.dir(linuxAppImageDirectory)

    doFirst {
        delete(linuxAppImageDirectory)

        File javaExecutable = packagingLauncher.get().executablePath.asFile
        File jpackageExecutable = new File(javaExecutable.parentFile, 'jpackage')
        if (!jpackageExecutable.isFile()) {
            throw new GradleException("Java 25 tööriistaahelast ei leitud jpackage käsku: ${jpackageExecutable}")
        }
        String javaFxModulePath = javaFxRuntimeJars.files
                .sort { first, second -> first.name <=> second.name }
                .collect { it.absolutePath }
                .join(File.pathSeparator)

        commandLine(
                jpackageExecutable,
                '--type', 'app-image',
                '--dest', linuxPackageDirectory.get().asFile,
                '--name', linuxAppName,
                '--app-version', project.version.toString(),
                '--description', 'Sündmusala ja elektrivajaduse planeerija',
                '--icon', applicationIcon.asFile,
                '--input', packageInputDirectory.get().asFile,
                '--main-jar', tasks.named('jar', Jar).get().archiveFileName.get(),
                '--main-class', packagedMainClass,
                '--module-path', javaFxModulePath,
                '--add-modules', packagedJavaModules,
                '--java-options', '--enable-native-access=javafx.graphics'
        )
    }

    doLast {
        copy {
            from linuxThemeIcons
            into linuxAppImageDirectory.get().dir('lib/icons').asFile
        }
    }
}

tasks.register('packageLinuxRpm', Exec) {
    group = 'distribution'
    description = 'Builds a Fedora-compatible RPM package from the Linux application image.'
    dependsOn tasks.named('packageLinuxAppImage')
    onlyIf {
        System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('linux')
    }

    inputs.dir(linuxAppImageDirectory)
    inputs.dir(linuxPackageResources)
    inputs.file(applicationIcon)
    inputs.file(planFileIcon)
    outputs.dir(linuxRpmDirectory)

    doFirst {
        delete(linuxRpmDirectory)
        File rpmDirectory = linuxRpmDirectory.get().asFile
        if (!rpmDirectory.mkdirs() && !rpmDirectory.isDirectory()) {
            throw new GradleException("RPM-paketi väljundkausta ei saanud luua: ${rpmDirectory}")
        }

        File javaExecutable = packagingLauncher.get().executablePath.asFile
        File jpackageExecutable = new File(javaExecutable.parentFile, 'jpackage')
        if (!jpackageExecutable.isFile()) {
            throw new GradleException("Java 25 tööriistaahelast ei leitud jpackage käsku: ${jpackageExecutable}")
        }

        commandLine(
                jpackageExecutable,
                '--type', 'rpm',
                '--dest', rpmDirectory,
                '--name', linuxAppName,
                '--app-image', linuxAppImageDirectory.get().asFile,
                '--app-version', project.version.toString(),
                '--vendor', 'Plaanisepp',
                '--description', 'Sündmusala ja elektrivajaduse planeerija',
                '--icon', applicationIcon.asFile,
                '--resource-dir', linuxPackageResources.asFile,
                '--file-associations', planFileAssociation.asFile,
                '--linux-package-name', linuxAppName,
                '--linux-app-release', '4',
                '--linux-app-category', 'Office',
                '--linux-menu-group', 'Office',
                '--linux-shortcut'
        )
    }
}
